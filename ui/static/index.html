<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>go-redis-cron</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <main>
    <header>
      <h1>go-redis-cron</h1>
      <p class="subtitle">Distributed cron jobs (leader runs schedules)</p>
    </header>
    <section id="status" class="banner" hidden></section>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Spec</th>
          <th>Leader</th>
          <th>Last status</th>
          <th>Last run</th>
          <th>Next run</th>
          <th>Error</th>
        </tr>
      </thead>
      <tbody id="jobs"></tbody>
    </table>
  </main>
  <script src="app.js"></script>
</body>
</html>
