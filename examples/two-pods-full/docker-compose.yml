services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  pod-a:
    build:
      context: ../..
      dockerfile: examples/two-pods-full/Dockerfile
    environment:
      REDIS_ADDR: redis:6379
      NAMESPACE: two-pods-demo
      INSTANCE_ID: pod-a
      HTTP_ADDR: ":8080"
      UI_PREFIX: /cron
    depends_on:
      - redis

  pod-b:
    build:
      context: ../..
      dockerfile: examples/two-pods-full/Dockerfile
    environment:
      REDIS_ADDR: redis:6379
      NAMESPACE: two-pods-demo
      INSTANCE_ID: pod-b
      HTTP_ADDR: ":8080"
      UI_PREFIX: /cron
    depends_on:
      - redis

  # Single host port: round-robin to either pod's embedded UI (Compose has no built-in LB).
  lb:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pod-a
      - pod-b
