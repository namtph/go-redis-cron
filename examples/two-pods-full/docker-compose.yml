services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  pod-a:
    build:
      context: ../..
      dockerfile: examples/two-pods-full/Dockerfile
    environment:
      REDIS_ADDR: redis:6379
      NAMESPACE: two-pods-demo
      INSTANCE_ID: pod-a
      HTTP_ADDR: ":8080"
      UI_PREFIX: /cron
    ports:
      - "8080:8080"
    depends_on:
      - redis

  pod-b:
    build:
      context: ../..
      dockerfile: examples/two-pods-full/Dockerfile
    environment:
      REDIS_ADDR: redis:6379
      NAMESPACE: two-pods-demo
      INSTANCE_ID: pod-b
      HTTP_ADDR: ":8080"
      UI_PREFIX: /cron
    ports:
      - "8081:8080"
    depends_on:
      - redis
